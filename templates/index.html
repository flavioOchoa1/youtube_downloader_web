<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descarga de musica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<canvas id="spaceCanvas" aria-hidden="true"></canvas>
<div class="cosmic-scene" aria-hidden="true"></div>

<main class="app-shell">
    <header class="app-header">
        <div class="brand">
            <span class="brand-mark">DM</span>
            <span>Music Downloader</span>
        </div>
        <button type="button" id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">
            <span class="theme-icon" aria-hidden="true"></span>
        </button>
    </header>

    <section class="hero-title" aria-label="Titulo principal">
        <div id="dotVortex" class="dot-vortex" aria-hidden="true"></div>
        <p class="eyebrow">ffmpeg + yt-dlp</p>
        <h1>Descarga de musica</h1>
    </section>

    <section class="download-card">
        <form id="downloadForm" method="post" action="/download">
            <div class="mb-3">
                <label for="url" class="form-label">URL del video:</label>
                <input
                    type="text"
                    id="url"
                    name="url"
                    class="form-control"
                    required
                    oninput="fetchVideoDetails()"
                    placeholder="Pega el enlace aqui"
                >
            </div>

            <div class="format-panel mb-3" role="radiogroup" aria-label="Formato">
                <label class="format-option" for="mp3">
                    <input type="radio" id="mp3" name="format" value="mp3" checked>
                    <span>
                        <strong>MP3</strong>
                        <small>Audio</small>
                    </span>
                </label>
                <label class="format-option" for="mp4">
                    <input type="radio" id="mp4" name="format" value="mp4">
                    <span>
                        <strong>MP4</strong>
                        <small>Video</small>
                    </span>
                </label>
            </div>

            <button type="submit" class="download-button">Descargar</button>
        </form>

        <div class="result-container">
            <div id="video-info">
                <div id="spinner" class="spinner hidden"></div>
                <h3 id="video-title" class="hidden"></h3>
                <img id="video-thumbnail" class="hidden" src="" alt="Miniatura del video">
            </div>
        </div>
    </section>
</main>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
